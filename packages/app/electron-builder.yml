# The installer (task 13.2): a per-user NSIS installer on Windows, updated from
# the releases of the repository (electron-updater reads `publish`). macOS and
# Linux are built at best. The code is not signed yet: Windows warns at the
# first install (design §17.2, Paul's decision).

appId: dev.apartejs.bonaparte
productName: bonaparte
copyright: Copyright © 2026 Paul Richez

# The packed package's name: a per-user installer puts the app under %LOCALAPPDATA%\Programs\<name>, which the
# workspace's scoped name made « @apartebonaparte-app ». The data and the window's profile have their own paths
# (startup.ts), so nothing else moves.
extraMetadata:
  name: bonaparte

directories:
  output: dist

# What electron-vite built, and the icons the main process reads. The
# workspace packages are bundled into `out/`; only the third-party
# dependencies of the app travel in node_modules.
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'

# node-pty's native module and its console agent run from the disk, never from
# the archive; it loads under Electron without a rebuild (a lesson of v0).
asarUnpack:
  - node_modules/node-pty/**
  # The Visual C++ runtime llama.cpp's package lacks (scripts/prepare-vcruntime.mjs):
  # llama.cpp, a program of its own, copies it from the disk, never from the archive.
  - resources/vcruntime/**
npmRebuild: false
nodeGypRebuild: false

win:
  target:
    - nsis
  icon: resources/icons/app-512.png

nsis:
  # Per user, no administrator: installed under the person's own folder.
  oneClick: true
  perMachine: false
  allowElevation: false
  # The conversations and their memory live in the data folder: an uninstall
  # never takes them.
  deleteAppDataOnUninstall: false
  artifactName: bonaparte-setup-${version}.${ext}

# The Microsoft Store (prepared, not submitted): `pnpm dist:store` makes an AppX
# the Store signs at submission. It needs the Windows SDK, named by
# ELECTRON_BUILDER_WINDOWS_KITS_PATH (its bin\<version>\x64 folder): the
# makeappx electron-builder brings lacks a DLL. The tiles are build/appx/*.png. The identity is Partner Center's, once the
# name is reserved there: Package/Identity/Name, Package/Identity/Publisher and
# the publisher's display name replace these placeholders. The Store build does
# not update itself (process.windowsStore): the Store does.
appx:
  identityName: apartejs.bonaparte
  publisherDisplayName: apartejs
  displayName: bonaparte
  applicationId: bonaparte
  backgroundColor: '#FFFFFF'
  languages:
    - fr-FR
    - en-US

mac:
  target:
    - dmg
  icon: resources/icons/app-512.png
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  icon: resources/icons/app-512.png
  category: Development

publish:
  provider: github
  owner: apartejs
  repo: bonapartejs
  releaseType: draft
