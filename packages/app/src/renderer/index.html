<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bonaparte</title>
    <!-- Anti-flash: sets the theme before the first paint (monaparte pattern).
         CSP: applied on the main process side at packaging time (dev inline
         scripts — this one and React's HMR preamble — prevent it here). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bp.theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.setAttribute('data-aparte-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          /* default theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
