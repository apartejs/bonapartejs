name: Bug report
description: Something behaves wrong in the app, the harness or a plugin
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: bonaparte version
      description: "`bonaparte --version`, or the commit if you run from source."
      placeholder: "0.1.0"
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: ["Windows", "macOS", "Linux"]
    validations: { required: true }
  - type: input
    id: gpu
    attributes:
      label: GPU and VRAM
      description: As reported by `bonaparte doctor`.
      placeholder: "Radeon 8060S, 32 GB shared / RTX 4070, 12 GB / none (CPU)"
  - type: input
    id: llama
    attributes:
      label: llama.cpp build
      description: "`llama-server --version`, or the build shown in Settings."
      placeholder: "b6521, Vulkan"
    validations: { required: true }
  - type: input
    id: model
    attributes:
      label: Model
      description: File name and quantisation of the GGUF, and the context size.
      placeholder: "Qwen3.5-35B-A3B-Q4_K_M.gguf, n_ctx 16384"
  - type: textarea
    id: repro
    attributes:
      label: What you did
      description: >
        Step by step. If a tool call is involved, the play mode you were in
        (lecture / repetition / plume / impro) matters.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected, what happened instead
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        The main-process log (run `pnpm dev` from source, or the terminal that
        launched `npx @aparte/bonaparte`) and the `[llama-server]` lines around
        the failure. Remove anything private — prompts and file contents end up
        in these logs.
      render: text
