name: Feature request
description: A capability bonaparte should have
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem you're solving
      description: What you're doing with a local model, and where bonaparte stops short.
    validations: { required: true }
  - type: textarea
    id: shape
    attributes:
      label: The shape you'd expect
      description: >
        A sketch is welcome. Two boundaries decide a lot up front: bonaparte drives
        llama.cpp only (no OpenAI-compatible backends — none exposes the state we
        persist), and it is not a model manager (bring your own GGUF).
  - type: textarea
    id: cost
    attributes:
      label: What it would cost the user
      description: >
        A model reload, a re-prefill, disk space for saved states, a restart? The
        rule of the product is that nothing expensive happens without being
        announced — a feature that hides a cost will be asked to show it.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
