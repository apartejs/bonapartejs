name: release

# The installers (task 13.2): built on a tag `v*` that Paul pushes, and
# published as a draft release of the repository — electron-updater reads its
# `latest.yml`. Nothing here runs on a branch, and nothing is signed yet
# (design §17.2): Windows warns at the first install.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NX_DAEMON: 'false'

jobs:
  # One draft release for the tag, made before the installers: three jobs that
  # each made their own would leave three drafts.
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1             || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."

  installer:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        # Windows is the product's platform; macOS and Linux at best. Windows on the image
        # with Visual Studio 2026, as llama.cpp's own Windows builds: its redistributable
        # Visual C++ runtime is the one the installer carries for llama.cpp.
        os: [windows-2025-vs2026, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The tag is the version: a release whose tag and package disagree would
      # offer an update that is not one.
      - name: Check the version
        shell: bash
        run: |
          version=$(node -p "require('./packages/app/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, app $version"; exit 1; }

      # The Visual C++ runtime llama.cpp's package lacks, from the runner's Visual
      # Studio (its redistributable folder): the installer carries it.
      - name: Prepare the Visual C++ runtime
        if: runner.os == 'Windows'
        working-directory: packages/app
        run: node scripts/prepare-vcruntime.mjs

      # The packed app is run before it is published: a file it needs at run time
      # and the pack missed fails here, not on the person's machine.
      - name: Pack and run the packed app
        if: runner.os == 'Windows'
        working-directory: packages/app
        run: |
          pnpm exec electron-builder --dir --publish never
          pnpm exec playwright test e2e/packaged.spec.ts

      - name: Build and publish the installer
        working-directory: packages/app
        run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
