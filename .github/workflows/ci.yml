name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A superseded push cancels its in-flight run instead of queuing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No nx daemon on a runner: it answers cache questions from a table its file
  # watcher keeps, and that table has been seen lying about an emptied dist/.
  NX_DAEMON: 'false'

jobs:
  # The gate, on both platforms the app is developed for. Windows is not a
  # courtesy: node-pty builds against ConPTY there, and the maintainer's machine
  # is the reference — a break that only shows on Ubuntu is the one this matrix
  # is here to catch.
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        # version is read from the packageManager field in package.json

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # Native modules (node-pty) and the Electron binary build/download here:
      # pnpm.onlyBuiltDependencies allows exactly those.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # Electron E2E, on Windows only: `privateBytes` — the metric the memory budget
  # is measured on — is populated there and falls back to a noisy working set
  # elsewhere. The spec sets BONAPARTE_E2E=1 (never shows the window) and an
  # isolated BONAPARTE_DATA_DIR itself.
  e2e:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Electron E2E
        run: pnpm --filter @aparte/bonaparte-app test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: packages/app/playwright-report/
          retention-days: 7
